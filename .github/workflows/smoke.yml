name: smoke

# smoke_test.py --all validates every row of train+test against the schema
# invariants - no GPU, no checkpoint, ~30s on a free runner. It is what catches
# the two dataset-shape traps documented in the README before they reach a run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache HuggingFace downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-modernbert-base-v1

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Compile every module
        run: python -m compileall -q .

      - name: Validate every row of train+test
        run: python smoke_test.py --all
