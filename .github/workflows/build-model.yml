name: build-model

# Builds the Action's model files on GitHub's side, so the only upload from a
# laptop is the 298 MB fp16 checkpoint (six pieces on the release). Joins and
# checks it, exports both ONNX graphs, fits the 20 probes, replays the full
# 400-case test split through the Action's own runtime, then attaches the files,
# SHA256SUMS and measured.json to the same release. Commit those two back.

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag holding jevlite-fp16.pt.part-*
        default: model-v1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache HuggingFace downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-modernbert-base-v1

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyyaml

      - name: Join and check the checkpoint
        run: |
          gh release download "$TAG" -p 'jevlite-fp16.pt.part-*' -p 'jevlite-fp16.pt.sha256'
          cat jevlite-fp16.pt.part-* > jevlite-fp16.pt
          sha256sum -c jevlite-fp16.pt.sha256

      - name: Build assets
        run: python action/build_assets.py --ckpt jevlite-fp16.pt --out dist

      - name: Verify on the full test split
        run: python action/verify.py --dir dist

      - name: Attach to the release
        run: |
          gh release upload "$TAG" dist/* action/SHA256SUMS action/measured.json --clobber
          {
            echo "### Attached to $TAG"; echo
            echo '```'; cat action/SHA256SUMS; echo; cat action/measured.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
